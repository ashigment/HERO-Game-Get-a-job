<style>

    font-weight: 800;
    text-align: center;

    gap: 12px;
    margin-bottom: 24px;

    font-weight: 700;

    border-radius: 12px;
    background: #ffffff;
    color: #2c3e50;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 12px rgba(120, 150, 190, 0.15);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #langBtn:hover {
    transform: translateY(-2px);
    border-color: #4facfe;
    color: #1565c0;
    box-shadow: 0 8px 20px rgba(79, 172, 254, 0.25);
  }

  #difficultySelection {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    max-width: 900px;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .canvas-btn {
    padding: 16px 22px;
    font-size: 1rem;
    font-weight: 600;
    border: 2px solid #d0dbe8;
    border-radius: 14px;
    background: #ffffff;
    color: #2c3e50;

    box-shadow: 0 4px 12px rgba(120, 150, 190, 0.15);

    color: #1565c0;
    box-shadow: 0 12px 28px rgba(79, 172, 254, 0.35);

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }

  #workspace {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 620px;
    animation: fadeIn 0.6s ease;
  }

  #workspace.active { display: flex; }

  .scene {
    width: 100%;
    background: #ffffff;
    border: 1px solid #e3ebf3;
    border-radius: 18px;
    box-shadow: 0 6px 24px rgba(120, 150, 190, 0.15);

    flex-direction: column;

  let actx = null;
  let masterGain = null;
  let muted = false;

  function initAudio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = actx.createGain();
        masterGain.gain.value = muted ? 0 : 1;
        masterGain.connect(actx.destination);
      } catch(e) { console.error('Web Audio API not supported'); }
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }

  function beep(freq, dur, type, vol, dest) {
    if (!actx || muted) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.04;
    o.connect(g); g.connect(dest || masterGain);
    const t = actx.currentTime;
    o.start(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.stop(t + dur + 0.02);
  }

  // ===================== ПИКСЕЛЬНЫЕ ГОЛОСА (ПУЖИК СТИЛЬ) =====================
  function playPixelVoice(text, voiceType) {
    if (!actx || muted) return;
    const syllables = Math.max(3, Math.min(12, Math.floor(text.length / 2.5)));
    let baseFreq = voiceType === 'player' ? 170 : 140;
    let pitchSpread = voiceType === 'player' ? 40 : 30;
    let rate = 0.12;
    const now = actx.currentTime;
    
    for (let i = 0; i < syllables; i++) {
      const timeOffset = now + i * 0.08;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = 'sawtooth';
      const freq = baseFreq + (Math.random() * pitchSpread - pitchSpread/2);
      o.frequency.setValueAtTime(freq, timeOffset);
      if (voiceType === 'hr' && i === syllables - 1) {
        o.frequency.exponentialRampToValueAtTime(freq * 0.8, timeOffset + rate);
      }
      g.gain.setValueAtTime(0, timeOffset);
      g.gain.linearRampToValueAtTime(0.04, timeOffset + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, timeOffset + rate);
      o.connect(g); g.connect(masterGain);
      o.start(timeOffset); o.stop(timeOffset + rate + 0.05);
    }
  }

  function speakPlayer(text) { playPixelVoice(text, 'player'); }

  const THEMES = {
    menu: { chords: [[261.63, 329.63, 392.00], [220.00, 261.63, 329.63], [174.61, 220.00, 261.63], [196.00, 246.94, 293.66]], chordDur: 4.0, bassFreq: 65.41, bassVol: 0.03, chordVol: 0.06, filterFreq: 1100, dropChance: 0.6, dropVol: 0.035, wave: 'sine' },
    easy: { chords: [[261.63, 329.63, 392.00], [246.94, 293.66, 349.23], [220.00, 261.63, 329.63], [174.61, 220.00, 261.63]], chordDur: 3.4, bassFreq: 73.42, bassVol: 0.03, chordVol: 0.07, filterFreq: 1300, dropChance: 0.6, dropVol: 0.04, wave: 'sine' },
    normal: { chords: [[293.66, 349.23, 440.00], [246.94, 293.66, 369.99], [220.00, 277.18, 329.63], [196.00, 246.94, 293.66]], chordDur: 3.0, bassFreq: 82.41, bassVol: 0.035, chordVol: 0.07, filterFreq: 1400, dropChance: 0.55, dropVol: 0.04, wave: 'sine' },
    harder: { chords: [[311.13, 369.99, 466.16], [277.18, 329.63, 415.30], [246.94, 311.13, 369.99], [220.00, 261.63, 329.63]], chordDur: 2.6, bassFreq: 92.50, bassVol: 0.04, chordVol: 0.075, filterFreq: 1600, dropChance: 0.5, dropVol: 0.045, wave: 'triangle' },
    hard: { chords: [[329.63, 415.30, 493.88], [293.66, 349.23, 440.00], [261.63, 311.13, 392.00], [246.94, 293.66, 349.23]], chordDur: 2.2, bassFreq: 98.00, bassVol: 0.05, chordVol: 0.08, filterFreq: 1800, dropChance: 0.45, dropVol: 0.05, wave: 'triangle' },
    insane: { chords: [[349.23, 440.00, 523.25], [311.13, 392.00, 466.16], [277.18, 349.23, 415.30], [261.63, 329.63, 392.00]], chordDur: 1.8, bassFreq: 110.00, bassVol: 0.06, chordVol: 0.085, filterFreq: 2200, dropChance: 0.4, dropVol: 0.06, wave: 'sawtooth' }
  };

  function stopMusic() {
    musicOn = false;
    currentMusicTheme = null;
    if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
    musicNodes.forEach(n => {
      try { n.stop && n.stop(); } catch(e) {}
      try { n.disconnect && n.disconnect(); } catch(e) {}
    });
    musicNodes = [];
    if (musicBus) {
      try { musicBus.disconnect(); } catch(e) {}
      musicBus = null;
    }
  }

  function startMusic(themeName) {
    initAudio();
    if (!actx) return;
    if (musicOn && currentMusicTheme === themeName) return;
    stopMusic();
    musicOn = true;
    currentMusicTheme = themeName;
    const theme = THEMES[themeName];
    if (!theme) return;

    musicBus = actx.createGain();
    musicBus.gain.value = 0;
    musicBus.connect(masterGain);
    musicBus.gain.linearRampToValueAtTime(1, actx.currentTime + 1.5);

    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = theme.filterFreq;
    filter.Q.value = 0.7;
    filter.connect(musicBus);

    const bassOsc = actx.createOscillator();
    const bassGain = actx.createGain();
    bassOsc.type = theme.wave;
    bassOsc.frequency.value = theme.bassFreq;
    bassGain.gain.value = theme.bassVol;
    bassOsc.connect(bassGain); bassGain.connect(musicBus);
    bassOsc.start();
    musicNodes.push(bassOsc, bassGain);

    let chordIndex = 0;
    function playChord(freqs) {
      if (!musicOn) return;
      const now = actx.currentTime;
      freqs.forEach(f => {
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = theme.wave;
        o.frequency.value = f;
        g.gain.value = 0;
        o.connect(g); g.connect(filter);
        o.start(now);
        g.gain.linearRampToValueAtTime(theme.chordVol, now + 0.8);
        g.gain.linearRampToValueAtTime(0.0, now + theme.chordDur - 0.2);
        o.stop(now + theme.chordDur + 0.1);
      });
    }
    function nextChord() {
      if (!musicOn) return;
      playChord(theme.chords[chordIndex % theme.chords.length]);
      chordIndex++;
      musicTimer = setTimeout(nextChord, theme.chordDur * 1000);
    }
    nextChord();

    const drops = [523.25, 659.25, 783.99, 880.00, 1046.50, 1174.66];
    let dropTimer = null;
    function playDrop() {
      if (!musicOn) return;
      if (Math.random() < theme.dropChance) {
        const f = drops[Math.floor(Math.random() * drops.length)];
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.value = 0;
        o.connect(g); g.connect(filter);
        const now = actx.currentTime;
        o.start(now);
        g.gain.linearRampToValueAtTime(theme.dropVol, now + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
        o.stop(now + 0.8);
      }
      dropTimer = setTimeout(playDrop, 2000 + Math.random() * 3000);
    }
    setTimeout(playDrop, 1200);
  }

  // ===================== MUTE =====================
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (masterGain && actx) {
      masterGain.gain.linearRampToValueAtTime(muted ? 0 : 1, actx.currentTime + 0.2);
    }
  });

  // ===================== ЛОГИКА ИГРЫ =====================
  const DIFFICULTIES = [
    { id: 'easy',    mistakes: 2, questions: 5, lieChance: 0.00 },
    { id: 'normal',  mistakes: 1, questions: 6, lieChance: 0.05 },
    { id: 'harder',  mistakes: 1, questions: 7, lieChance: 0.12 },
    { id: 'hard',    mistakes: 0, questions: 8, lieChance: 0.20 },
    { id: 'insane',  mistakes: 0, questions: 8, lieChance: 0.35 }
  ];

  const selectionEl = document.getElementById('difficultySelection');
  const workspaceEl = document.getElementById('workspace');
  const speakerEl = document.getElementById('speaker');
  const textEl = document.getElementById('text');
  const answersEl = document.getElementById('answers');
  const resultEl = document.getElementById('result');
  const progressFill = document.getElementById('progressFill');
  const toastEl = document.getElementById('toast');
  const backBtn = document.getElementById('backBtn');
  const mainTitle = document.getElementById('mainTitle');
  const hrNameEl = document.getElementById('hrName');
  const langBtn = document.getElementById('langBtn');

  function renderMenu() {
    mainTitle.textContent = t.title;
    hrNameEl.textContent = t.hrName;
    langBtn.textContent = t.langBtn;
    backBtn.textContent = t.back;

    selectionEl.innerHTML = '';
    DIFFICULTIES.forEach((d, i) => {
      const btn = document.createElement('button');
      btn.className = 'canvas-btn';
      btn.textContent = t.difficulties[i];
      btn.style.animationDelay = (i * 0.05) + 's';
      btn.addEventListener('click', () => {
        initAudio();
        startMusic(d.id);
        startGame(d);
      });
      selectionEl.appendChild(btn);
    });
  }

  // Инициализация меню
  renderMenu();

  langBtn.addEventListener('click', () => {
    lang = lang === 'ru' ? 'en' : 'ru';
    t = translations[lang];
    document.documentElement.lang = lang;
    renderMenu();
  });

  // Включаем музыку меню при первом клике
  window.addEventListener('pointerdown', function startMenu() {
    initAudio();
    if (!musicOn) startMusic('menu');
    window.removeEventListener('pointerdown', startMenu);
  });

  let state = {};

  function startGame(diff) {
    selectionEl.style.display = 'none';
    document.getElementById('menuControls').style.display = 'none';
    workspaceEl.classList.add('active');
    resultEl.classList.remove('show');
    resultEl.innerHTML = '';

    state = {
      diff: diff,
      mistakesLeft: diff.mistakes,
      lieChance: diff.lieChance,
      queue: shuffle(t.pool).slice(0, diff.questions - 1),
      index: 0,
      score: 0,
      total: diff.questions
    };

    renderQuestion(t.opening.q, t.opening.answers, t.opening.correct);
    updateProgress(0);
  }

  function updateProgress(fraction) {
    progressFill.style.width = Math.min(100, Math.round(fraction * 100)) + '%';
  }

  function renderQuestion(text, answers, correctIdx) {
    speakerEl.textContent = 'HR';
    textEl.textContent = text;
    speakHR(text);

    answersEl.innerHTML = '';
    const items = answers.map((a, i) => ({ text: a, ok: i === correctIdx }));
    const mixed = shuffle(items);

    mixed.forEach(item => {
      const b = document.createElement('button');
      b.className = 'answer-btn';
      b.textContent = item.text;
      b.addEventListener('click', () => handleAnswer(item, b));
      answersEl.appendChild(b);
    });
  }

  function handleAnswer(item, btn) {
    speakPlayer(item.text);
    answersEl.querySelectorAll('button').forEach(x => x.disabled = true);

    if (item.ok) {
      btn.style.borderColor = '#4facfe';
      btn.style.background = '#eaf4ff';
      state.score++;
      setTimeout(next, 1400);
    } else {
      btn.classList.add('wrong');
      state.mistakesLeft--;
      if (state.mistakesLeft < 0) {
        setTimeout(() => endGame(false), 900);
      } else {
        showToast(t.toastWrong + state.mistakesLeft);
        setTimeout(() => {
          answersEl.querySelectorAll('button').forEach(x => x.disabled = false);
        }, 700);
        setTimeout(() => btn.classList.remove('wrong'), 900);
      }
    }
  }

  function next() {
    if (state.index >= state.queue.length) {
      return endGame(true);
    }
    const q = state.queue[state.index++];
    updateProgress(state.score / state.total);
    renderQuestion(q.q, q.a, 0);
  }

  function endGame(passed) {
    answersEl.innerHTML = '';
    updateProgress(1);
    const pct = Math.round((state.score / state.total) * 100);

    let verdict, reason, finalLine;
    if (passed) {
      soundSuccess();
      if (pct >= 90) { verdict = t.verdictWin; reason = t.reasonWinHigh; }
      else if (pct >= 70) { verdict = t.verdictWin; reason = t.reasonWinMid; }
      else { verdict = t.verdictWin; reason = t.reasonWinLow; }
      finalLine = t.finalWin;
    } else {
      soundFail();
      verdict = t.verdictLose;
      reason = t.reasons[Math.floor(Math.random() * t.reasons.length)];
      finalLine = t.finalLose;
    }

    speakerEl.textContent = 'HR';
    textEl.textContent = finalLine;
    speakHR(finalLine);

    resultEl.innerHTML = `
      <div class="score">${pct}%</div>
      <div style="color:#4facfe;font-weight:700;font-size:0.85rem;margin-bottom:10px;">${verdict}</div>
      <div style="margin-bottom:14px;">${reason}</div>
      <div style="color:#7a8a9a;font-size:0.8rem;">
        ${t.statDiff} <b>${t.difficulties[DIFFICULTIES.findIndex(d => d.id === state.diff.id)]}</b> · ${t.statAnswers} <b>${state.score}/${state.total}</b>
      </div>
    `;
    resultEl.classList.add('show');
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  backBtn.addEventListener('click', () => {
    workspaceEl.classList.remove('active');
    document.getElementById('menuControls').style.display = 'flex';
    selectionEl.style.display = 'flex';
    resultEl.classList.remove('show');
    startMusic('menu');
  });

  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

})();
</script>
</body>
</html>
